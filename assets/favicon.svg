<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#7000ff" />
      <stop offset="100%" stop-color="#b026ff" />
    </linearGradient>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#05070d" />
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#bg-grad)" stroke="#00f3ff" stroke-width="12" stroke-opacity="0.65" />

  <!-- Inner Cyber Grid Accent Line -->
  <rect x="44" y="44" width="424" height="424" rx="88" fill="none" stroke="#7000ff" stroke-width="4" stroke-opacity="0.3" stroke-dasharray="16 12" />

  <!-- Stylized Geometric "S" Mark -->
  <g filter="url(#neon-glow)" fill="none" stroke="url(#cyber-grad)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 340 160 L 210 160 C 170 160 148 185 148 220 C 148 260 180 275 230 285 L 285 295 C 335 305 364 322 364 362 C 364 402 335 425 285 425 L 160 425" />
  </g>

  <!-- Cybernetic Core Accent Dots -->
  <circle cx="340" cy="160" r="14" fill="#00f3ff" />
  <circle cx="160" cy="425" r="14" fill="#b026ff" />
  <circle cx="380" cy="220" r="8" fill="#00ff9d" opacity="0.9" />
</svg>
